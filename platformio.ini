[platformio]
default_envs = stamp_s3a_audio

[env]
; Pin the toolchain version for reproducible builds.
platform = espressif32@6.10.0
board = m5stack-stamps3
framework = arduino
upload_protocol = esptool
upload_speed = 460800
monitor_speed = 115200
monitor_encoding = UTF-8
board_build.embed_txtfiles =
    web/piano.html
    web/piano.js
    web/piano.css
; The board definition supplies ARDUINO_USB_MODE=1 (hardware USB Serial/JTAG).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=4
; Do not define BOARD_HAS_PSRAM; this project does not depend on external PSRAM.
; If automatic port detection fails, set the actual port from Windows Device Manager.
; upload_port = COM5
; monitor_port = COM5

[env:stamp_s3a_sd]
build_flags = ${env.build_flags} -DPROJECT_STAGE=1

[env:stamp_s3a_wifi]
build_flags = ${env.build_flags} -DPROJECT_STAGE=2

[env:stamp_s3a_web]
build_flags = ${env.build_flags} -DPROJECT_STAGE=3

[env:stamp_s3a_audio]
build_flags = ${env.build_flags} -DPROJECT_STAGE=5
