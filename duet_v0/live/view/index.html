<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duet Live</title>
<style>
  :root {
    --bg: #fbfbfd; --fg: #1d1d1f; --muted: #86868b; --line: #e5e5ea; --card: #ffffff;
    --her: #0071e3; --ref: #d2d2d7; --harm: #bf5af2; --harm-fill: rgba(191, 90, 242, .85);
    --ok: #30d158; --warn: #ff9f0a; --bad: #ff453a; --cursor: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --fg: #f5f5f7; --muted: #8e8e93; --line: #2c2c2e; --card: #1c1c1e;
            --ref: #3a3a3c; --cursor: #f5f5f7; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 24px 32px; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .pill { font-size: 15px; font-weight: 600; padding: 5px 14px; border-radius: 999px; background: var(--line); }
  .pill.following { background: rgba(0,113,227,.12); color: var(--her); }
  .pill.singing { background: rgba(191,90,242,.14); color: var(--harm); }
  .pill.holding { background: rgba(255,159,10,.16); color: var(--warn); }
  .pill.searching { background: rgba(255,69,58,.14); color: var(--bad); }
  .clock { margin-left: auto; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stage { margin-top: 20px; background: var(--card); border-radius: 22px; padding: 10px; border: 1px solid var(--line); }
  canvas { width: 100%; height: 380px; display: block; }
  .progress { height: 4px; background: var(--line); border-radius: 2px; margin: 8px 10px 4px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--her); }
  .legend { display: flex; gap: 18px; font-size: 13px; color: var(--muted); padding: 2px 12px 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 18px; height: 6px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-top: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; min-height: 112px; }
  .tile .k { font-size: 13px; color: var(--muted); font-weight: 500; }
  .tile .v { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--ok); transition: width .1s linear; }
  .err { color: var(--bad); font-size: 14px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Duet</h1>
    <span id="status" class="pill">connecting</span>
    <span class="clock" id="clock">–</span>
  </header>

  <div class="stage">
    <canvas id="roll"></canvas>
    <div class="progress"><div id="prog"></div></div>
    <div class="legend">
      <span><i style="background:var(--ref)"></i>Melody (rehearsal)</span>
      <span><i style="background:var(--her)"></i>Her voice, placed where Duet thinks she is</span>
      <span><i style="background:var(--harm)"></i>Duet's harmony</span>
    </div>
  </div>

  <div class="tiles">
    <div class="tile"><div class="k">Her pitch</div><div class="v" id="her">–</div><div class="s" id="hers">&nbsp;</div></div>
    <div class="tile"><div class="k">Confidence</div><div class="v" id="conf">–</div><div class="bar"><div id="confbar"></div></div></div>
    <div class="tile"><div class="k">Tempo vs rehearsal</div><div class="v" id="tempo">–</div><div class="s" id="tempos">&nbsp;</div></div>
    <div class="tile"><div class="k">Next harmony note</div><div class="v" id="next">–</div><div class="s" id="nexts">&nbsp;</div></div>
    <div class="tile"><div class="k">Nod</div><div class="v" id="nod">rest</div><div class="s" id="nods">&nbsp;</div></div>
    <div class="tile"><div class="k">Compute per 10 ms</div><div class="v" id="cpu">–</div><div class="s" id="cpus">&nbsp;</div></div>
  </div>
  <div class="err" id="err"></div>
</div>

<script>
const NAMES = ['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const nn = m => NAMES[((Math.round(m) % 12) + 12) % 12] + (Math.floor(Math.round(m) / 12) - 1);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
let REF = null, S = null, lastOk = 0;
const BEFORE = 4.0, AFTER = 3.0;          // seconds of score shown behind / ahead of her

async function loadRef() {
  try { REF = await (await fetch('/reference.json', {cache: 'no-store'})).json(); }
  catch (e) { setTimeout(loadRef, 1000); }
}
async function poll() {
  try {
    const r = await fetch('/state.json', {cache: 'no-store'});
    S = await r.json(); lastOk = performance.now(); $('err').textContent = '';
  } catch (e) {
    if (performance.now() - lastOk > 2000) $('err').textContent = 'Engine not reachable — is duet_live.py running?';
  }
  setTimeout(poll, 66);
}

function draw() {
  const cv = $('roll'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  if (!REF || !S) { requestAnimationFrame(draw); return; }
  const mids = REF.notes.map(n => n.midi).concat(REF.plan.map(p => p.h));
  const lo = Math.min(...mids) - 2, hi = Math.max(...mids) + 2;
  const pad = 36, t0 = S.ref_t - BEFORE, t1 = S.ref_t + AFTER;
  const X = t => pad + (t - t0) / (t1 - t0) * (W - 2 * pad);
  const Y = m => H - 18 - (m - lo) / (hi - lo) * (H - 36);
  const rowH = Math.max(6, (H - 36) / (hi - lo) * 0.8);
  // pitch grid: C and A lines
  g.font = '11px -apple-system, sans-serif'; g.fillStyle = css('--muted'); g.strokeStyle = css('--line'); g.lineWidth = 1;
  for (let m = Math.ceil(lo); m <= hi; m++) {
    if (m % 12 === 0 || m % 12 === 9) { g.beginPath(); g.moveTo(pad, Y(m)); g.lineTo(W - pad, Y(m)); g.stroke(); g.fillText(nn(m), 4, Y(m) + 4); }
  }
  // breaths
  g.fillStyle = css('--line');
  for (const b of REF.breaths) if (b > t0 && b < t1) g.fillRect(X(b) - 1, 10, 2, H - 20);
  const bar = (a, b, m, fill, stroke) => {
    const x0 = Math.max(X(a), pad - 4), x1 = Math.min(X(b), W - pad + 4);
    if (x1 <= x0) return;
    const y = Y(m) - rowH / 2, r = Math.min(rowH / 2, 5);
    g.beginPath(); g.roundRect(x0, y, x1 - x0, rowH, r);
    if (fill) { g.fillStyle = fill; g.fill(); }
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1.5; g.stroke(); }
  };
  for (const n of REF.notes) if (n.off > t0 && n.on < t1) bar(n.on, n.off, n.midi, css('--ref'));
  const played = new Set((S.machine || []).map(q => q.r));
  for (const p of REF.plan) if (p.r + p.dur > t0 && p.r < t1)
    bar(p.r, p.r + p.dur, p.h, played.has(p.r) ? css('--harm-fill') : null, css('--harm'));
  // her voice trail, in reference time (where the follower placed her)
  g.strokeStyle = css('--her'); g.lineWidth = 3; g.lineCap = 'round'; g.beginPath();
  let pen = false, prev = null;
  for (const [t, r, m] of (S.hist || [])) {
    if (m === null || r < t0 || (prev !== null && Math.abs(r - prev) > 0.3)) { pen = false; prev = r; if (m === null) continue; }
    if (!pen) { g.moveTo(X(r), Y(m)); pen = true; } else g.lineTo(X(r), Y(m));
    prev = r;
  }
  g.stroke();
  // cursor
  g.strokeStyle = css('--cursor'); g.globalAlpha = .55; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(X(S.ref_t), 6); g.lineTo(X(S.ref_t), H - 6); g.stroke(); g.globalAlpha = 1;
  if (S.her_midi !== null) { g.fillStyle = css('--her'); g.beginPath(); g.arc(X(S.ref_t), Y(S.her_midi), 6, 0, 7); g.fill(); }
  requestAnimationFrame(draw);
}

function tiles() {
  if (S) {
    const st = $('status'); st.textContent = S.status; st.className = 'pill ' + S.status;
    $('clock').textContent = `${S.t.toFixed(1)} s live · ${S.ref_t.toFixed(1)} / ${S.ref_dur.toFixed(1)} s in the song · ${S.backend || ''}`;
    $('prog').style.width = (100 * S.ref_t / Math.max(1e-3, S.ref_dur)).toFixed(1) + '%';
    $('her').textContent = S.her_name || '–';
    $('hers').textContent = S.her_midi !== null ? `${(S.her_midi - Math.round(S.her_midi) >= 0 ? '+' : '')}${Math.round(100 * (S.her_midi - Math.round(S.her_midi)))} cents` : 'silent';
    $('conf').textContent = Math.round(100 * S.conf) + '%';
    const cb = $('confbar'); cb.style.width = Math.round(100 * Math.max(0, Math.min(1, S.conf))) + '%';
    cb.style.background = S.conf >= 0.55 ? css('--ok') : css('--warn');
    $('tempo').textContent = S.tempo_pct ? S.tempo_pct.toFixed(0) + '%' : '–';
    $('tempos').textContent = S.tempo_pct ? (S.tempo_pct > 101 ? 'faster than rehearsal' : S.tempo_pct < 99 ? 'slower than rehearsal' : 'as rehearsed') : '';
    if (S.next) {
      $('next').textContent = S.next.name;
      $('nexts').textContent = S.next.eta > 0 ? `in ${S.next.eta.toFixed(2)} s` : 'now';
    } else { $('next').textContent = '–'; $('nexts').textContent = 'end of plan'; }
    $('nexts').textContent += `  ·  sung ${S.played}, held ${S.held}`;
    $('nod').textContent = S.nod_phase === 'idle' ? 'rest' : S.nod_phase;
    $('nods').textContent = S.servo ? `last: ${S.servo.angle}° at ${S.servo.t.toFixed(2)} s` : 'no nod yet';
    if (S.frame_ms && S.frame_ms.p50 !== null) {
      $('cpu').textContent = S.frame_ms.p50.toFixed(2) + ' ms';
      $('cpus').textContent = `max ${S.frame_ms.max.toFixed(2)} ms · output latency ${S.out_latency_ms} ms · queue ${S.queue}`;
    }
  }
  setTimeout(tiles, 100);
}
loadRef(); poll(); tiles(); requestAnimationFrame(draw);
</script>
</body>
</html>
